name: Build NEREA (Windows x64)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate repository structure
        shell: pwsh
        run: ./tools/validate-project.ps1

      - name: Auto-fix HLSL reserved keywords
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Include *.hlsl,*.hlsli -File

          foreach ($file in $files) {
              $text = Get-Content $file.FullName -Raw
              $original = $text

              # Fix HLSL reserved keyword: "pass"
              $text = [regex]::Replace($text, '\bpass\b', 'drawPass')

              if ($text -ne $original) {
                  Set-Content -Path $file.FullName -Value $text -NoNewline
                  Write-Host "Auto-fixed: $($file.FullName)"
              }
          }

      - name: Validate HLSL shaders (FXC from the Windows SDK build tools)
        shell: pwsh
        run: ./tools/validate-shaders.ps1

      - name: Headless self-test (content, simulation, audio analysis, library, persistence)
        run: dotnet run --project tests/NEREA.Smoke/NEREA.Smoke.csproj -c Release

      - name: Restore App (win-x64)
        run: dotnet restore src/NEREA.App/NEREA.App.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/NEREA.App/NEREA.App.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== XamlCompiler Detailed Output ==="
            Get-ChildItem -Path "src/NEREA.App/obj" -Filter "output.json" -Recurse | ForEach-Object {
              Get-Content $_.FullName
            }
            exit 1
          }

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/NEREA.App/NEREA.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false
          -p:DebugType=none
          -o publish/NEREA

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path publish/NEREA/* -DestinationPath NEREA-win-x64.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DSourceDir=$PWD\publish\NEREA" "/DOutputDir=$PWD" "installer\NEREA.iss"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-win-x64
          path: NEREA-win-x64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-Setup
          path: NEREA-Setup.exe

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NEREA-win-x64.zip
            NEREA-Setup.exe
