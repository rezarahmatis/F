name: Build NEREA (Windows x64)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate repository structure
        shell: pwsh
        run: ./tools/validate-project.ps1

      - name: Restore
        run: dotnet restore src/NEREA.App/NEREA.App.csproj -r win-x64

      - name: Validate HLSL shaders (FXC from the Windows SDK build tools)
        shell: pwsh
        run: ./tools/validate-shaders.ps1

      - name: Headless self-test (content, simulation, audio analysis, library, persistence)
        run: dotnet run --project tests/NEREA.Smoke/NEREA.Smoke.csproj -c Release

      - name: Build
        run: dotnet build src/NEREA.App/NEREA.App.csproj -c Release -r win-x64 --no-restore

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/NEREA.App/NEREA.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=false -p:DebugType=none
          -o publish/NEREA

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path publish/NEREA/* -DestinationPath NEREA-win-x64.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$PWD\publish\NEREA" "/DOutputDir=$PWD" "installer\NEREA.iss"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-win-x64
          path: NEREA-win-x64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-Setup
          path: NEREA-Setup.exe

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NEREA-win-x64.zip
            NEREA-Setup.exe
